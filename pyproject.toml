[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diccionario-inverso-entregable"
version = "1.0.0"
description = "Recuperación de palabras mediante grafos de asociaciones y descripciones en español"
requires-python = ">=3.13,<3.14"
dependencies = [
  "networkx==3.5", "numpy==2.3.5", "pandas==2.3.3", "scipy==1.16.3",
  "spacy==3.8.18", "gensim==4.4.0", "igraph==1.0.0",
  "scikit-learn==1.9.1", "tqdm==4.70.1", "xlrd==2.0.2",
  "plotly==7.1.0", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
notebook = ["jupyterlab==4.6.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
